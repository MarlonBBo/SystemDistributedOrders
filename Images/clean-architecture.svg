<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title description">
  <title id="title">Clean Architecture do System Distributed Orders</title>
  <desc id="description">Diagrama das camadas API, Infrastructure, Application, Domain e Contracts, com dependências apontando para o núcleo.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-inward" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-flow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .text { font-family: "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #475569; }
      .layer-title { font-size: 21px; font-weight: 700; }
      .body { font-size: 14px; fill: #334155; }
      .small { font-size: 12px; fill: #475569; }
      .tag { font-size: 12px; font-weight: 700; letter-spacing: 0.7px; }
      .dependency { fill: none; stroke: #334155; stroke-width: 2.2; marker-end: url(#arrow-inward); }
      .flow { fill: none; stroke: #2563eb; stroke-width: 2.2; stroke-dasharray: 7 6; marker-end: url(#arrow-flow); }
    </style>
  </defs>

  <rect width="1400" height="900" fill="#f8fafc"/>
  <text x="70" y="58" class="text title">Clean Architecture — System Distributed Orders</text>
  <text x="70" y="86" class="text subtitle">As dependências de código apontam para o núcleo; detalhes externos implementam contratos definidos internamente.</text>

  <!-- Limite da aplicação -->
  <rect x="185" y="125" width="1030" height="665" rx="32" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <rect x="215" y="155" width="970" height="210" rx="24" fill="#eef6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="245" y="192" class="text tag" fill="#1d4ed8">CAMADA DE ENTRADA E COMPOSIÇÃO</text>

  <!-- API -->
  <rect x="250" y="216" width="390" height="118" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <circle cx="284" cy="250" r="16" fill="#dbeafe"/>
  <path d="M276 250h16M284 242v16" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
  <text x="310" y="256" class="text layer-title">API</text>
  <text x="276" y="287" class="text body">Endpoints HTTP • Swagger • tratamento de erros</text>
  <text x="276" y="312" class="text small">Program.cs é o composition root (injeção de dependência)</text>

  <!-- Infrastructure -->
  <rect x="760" y="216" width="390" height="118" rx="18" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <circle cx="794" cy="250" r="16" fill="#ccfbf1"/>
  <path d="M786 255l8-12 8 12M789 255h10" fill="none" stroke="#0f766e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="820" y="256" class="text layer-title">Infrastructure</text>
  <text x="786" y="287" class="text body">EF Core • repositórios • producer/consumer Kafka</text>
  <text x="786" y="312" class="text small">Implementa abstrações declaradas pela Application</text>

  <!-- Application ring -->
  <rect x="320" y="400" width="760" height="330" rx="32" fill="#fff8e8" stroke="#d97706" stroke-width="2.5"/>
  <text x="350" y="438" class="text tag" fill="#92400e">CAMADA DE CASOS DE USO</text>
  <text x="350" y="474" class="text layer-title">Application</text>
  <text x="350" y="499" class="text body">Commands, Queries, Handlers e portas (interfaces)</text>

  <!-- Application capabilities -->
  <rect x="350" y="526" width="202" height="61" rx="12" fill="#ffffff" stroke="#f59e0b"/>
  <text x="367" y="552" class="text body" font-weight="600">Pedidos</text>
  <text x="367" y="574" class="text small">criar • adicionar • submeter</text>
  <rect x="350" y="601" width="202" height="61" rx="12" fill="#ffffff" stroke="#f59e0b"/>
  <text x="367" y="627" class="text body" font-weight="600">Consultas e estados</text>
  <text x="367" y="649" class="text small">listar • pagar • cancelar</text>

  <!-- Domain core -->
  <rect x="590" y="505" width="300" height="142" rx="28" fill="#f3e8ff" stroke="#7e22ce" stroke-width="3" filter="url(#shadow)"/>
  <text x="740" y="544" text-anchor="middle" class="text tag" fill="#6b21a8">NÚCLEO</text>
  <text x="740" y="578" text-anchor="middle" class="text layer-title">Domain</text>
  <text x="740" y="605" text-anchor="middle" class="text body">Order • OrderItem • Product</text>
  <text x="740" y="627" text-anchor="middle" class="text small">regras, invariantes e exceções de negócio</text>

  <!-- Contracts core companion -->
  <rect x="916" y="526" width="134" height="136" rx="18" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="983" y="557" text-anchor="middle" class="text tag" fill="#166534">CONTRATOS</text>
  <text x="983" y="585" text-anchor="middle" class="text layer-title" font-size="18">Contracts</text>
  <text x="983" y="612" text-anchor="middle" class="text small">DTOs e evento</text>
  <text x="983" y="632" text-anchor="middle" class="text small">OrderSubmitted</text>
  <text x="983" y="650" text-anchor="middle" class="text small">sem dependências</text>

  <!-- Dependency arrows inside -->
  <path d="M552 556 C565 556 571 556 587 556" class="dependency"/>
  <path d="M915 595 C905 595 902 595 893 595" class="dependency"/>
  <text x="563" y="544" class="text small">usa</text>
  <text x="897" y="583" class="text small">usa</text>

  <!-- API/Infrastructure dependencies toward Application -->
  <path d="M445 334 L445 397" class="dependency"/>
  <path d="M955 334 L955 397" class="dependency"/>
  <path d="M640 275 C684 275 716 275 758 275" class="dependency"/>
  <text x="667" y="263" class="text small">compõe</text>

  <!-- External actors and services -->
  <rect x="25" y="218" width="125" height="92" rx="16" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <circle cx="87" cy="246" r="11" fill="none" stroke="#64748b" stroke-width="2"/>
  <path d="M65 285c4-18 40-18 44 0" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <text x="87" y="302" text-anchor="middle" class="text small">Cliente HTTP</text>
  <path d="M150 264 L247 264" class="flow"/>

  <rect x="1250" y="397" width="125" height="92" rx="16" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <ellipse cx="1312" cy="425" rx="29" ry="9" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <path d="M1283 425v30c0 12 58 12 58 0v-30M1283 440c0 12 58 12 58 0" fill="none" stroke="#0f766e" stroke-width="2"/>
  <text x="1312" y="477" text-anchor="middle" class="text small">SQL Server</text>
  <path d="M1151 298 C1235 314 1195 400 1247 430" class="flow"/>

  <rect x="1250" y="555" width="125" height="92" rx="16" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <circle cx="1291" cy="589" r="8" fill="#0f766e"/>
  <circle cx="1313" cy="589" r="8" fill="#14b8a6"/>
  <circle cx="1335" cy="589" r="8" fill="#5eead4"/>
  <path d="M1291 589h44" stroke="#0f766e" stroke-width="2"/>
  <text x="1312" y="625" text-anchor="middle" class="text small">Apache Kafka</text>
  <path d="M1151 303 C1225 360 1200 560 1247 588" class="flow"/>

  <!-- Legend -->
  <rect x="250" y="812" width="900" height="58" rx="15" fill="#ffffff" stroke="#cbd5e1"/>
  <path d="M284 841h76" class="dependency"/>
  <text x="375" y="846" class="text body">dependência de código (aponta para dentro)</text>
  <path d="M710 841h76" class="flow"/>
  <text x="801" y="846" class="text body">integração em tempo de execução</text>
</svg>
