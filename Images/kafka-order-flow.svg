<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo de submissão de pedido com Kafka</title>
  <desc id="desc">Diagrama do POST de submissão, persistência no SQL Server, publicação no Kafka e consumo com commit manual, retry e garantia de processamento pelo menos uma vez.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="145%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <style>
      .title { font: 700 34px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #64748b; }
      .box-title { font: 700 18px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; }
      .box-text { font: 400 14px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #475569; }
      .label { font: 600 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #475569; }
      .tiny { font: 500 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #64748b; }
      .pill { font: 700 11px system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: .7px; }
      .flow { fill: none; stroke: #475569; stroke-width: 2.5; marker-end: url(#arrow); }
      .flow-blue { fill: none; stroke: #2563eb; stroke-width: 2.7; marker-end: url(#arrowBlue); }
      .flow-red { fill: none; stroke: #dc2626; stroke-width: 2.5; stroke-dasharray: 8 6; marker-end: url(#arrowRed); }
    </style>
  </defs>

  <rect width="1600" height="1040" fill="url(#page)"/>
  <circle cx="1510" cy="75" r="150" fill="#dbeafe" opacity="0.45"/>
  <circle cx="95" cy="970" r="185" fill="#e0e7ff" opacity="0.45"/>

  <text x="70" y="68" class="title">Submissão de pedido: SQL Server → Kafka → Consumer</text>
  <text x="70" y="100" class="subtitle">Fluxo real da aplicação, com confirmação de offset somente após processamento bem-sucedido</text>

  <!-- Faixas arquiteturais -->
  <rect x="48" y="132" width="1504" height="282" rx="20" fill="#ffffff" stroke="#dbe3ee"/>
  <rect x="48" y="448" width="1504" height="394" rx="20" fill="#ffffff" stroke="#dbe3ee"/>
  <rect x="68" y="150" width="118" height="25" rx="12" fill="#e0f2fe"/>
  <text x="127" y="167" class="pill" text-anchor="middle" fill="#0369a1">COMANDO</text>
  <rect x="68" y="466" width="118" height="25" rx="12" fill="#ede9fe"/>
  <text x="127" y="483" class="pill" text-anchor="middle" fill="#6d28d9">EVENTO</text>

  <!-- Linha 1: comando síncrono -->
  <g filter="url(#shadow)">
    <rect x="75" y="214" width="210" height="126" rx="15" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.5"/>
    <rect x="323" y="214" width="225" height="126" rx="15" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <rect x="586" y="214" width="258" height="126" rx="15" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
    <rect x="882" y="214" width="215" height="126" rx="15" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
    <rect x="1135" y="214" width="232" height="126" rx="15" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.5"/>
  </g>

  <text x="180" y="250" class="box-title" text-anchor="middle">POST submit</text>
  <text x="180" y="278" class="box-text" text-anchor="middle">/api/orders/{id}/submit</text>
  <rect x="113" y="298" width="134" height="24" rx="12" fill="#0284c7"/>
  <text x="180" y="314" class="pill" text-anchor="middle" fill="#ffffff">HTTP REQUEST</text>

  <text x="435" y="250" class="box-title" text-anchor="middle">OrdersController</text>
  <text x="435" y="278" class="box-text" text-anchor="middle">Cria SubmitOrderCommand</text>
  <text x="435" y="301" class="box-text" text-anchor="middle">e chama HandleAsync</text>

  <text x="715" y="246" class="box-title" text-anchor="middle">SubmitOrderCommand</text>
  <text x="715" y="269" class="box-title" text-anchor="middle">Handler</text>
  <text x="715" y="300" class="box-text" text-anchor="middle">Busca o pedido e coordena</text>
  <text x="715" y="321" class="box-text" text-anchor="middle">a unidade de trabalho</text>

  <text x="989" y="250" class="box-title" text-anchor="middle">Order.Submit()</text>
  <text x="989" y="278" class="box-text" text-anchor="middle">Valida regras de domínio</text>
  <text x="989" y="301" class="box-text" text-anchor="middle">e altera o status</text>

  <text x="1251" y="250" class="box-title" text-anchor="middle">SQL Server</text>
  <text x="1251" y="278" class="box-text" text-anchor="middle">SaveChangesAsync</text>
  <text x="1251" y="301" class="box-text" text-anchor="middle">persiste o pedido primeiro</text>

  <path d="M285 277 H323" class="flow"/>
  <path d="M548 277 H586" class="flow"/>
  <path d="M844 277 H882" class="flow"/>
  <path d="M1097 277 H1135" class="flow"/>
  <text x="1116" y="259" class="tiny" text-anchor="middle">salva</text>

  <!-- Descida para publicação -->
  <path d="M1251 340 V420 Q1251 433 1238 433 H1213 V519" class="flow-blue"/>
  <text x="1270" y="400" class="label">Após salvar</text>

  <!-- Linha 2: evento assíncrono -->
  <g filter="url(#shadow)">
    <rect x="1090" y="519" width="246" height="142" rx="15" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.7"/>
    <rect x="733" y="519" width="304" height="190" rx="15" fill="#fff7ed" stroke="#fb923c" stroke-width="1.7"/>
    <rect x="389" y="519" width="288" height="142" rx="15" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.7"/>
    <rect x="83" y="519" width="252" height="142" rx="15" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.7"/>
  </g>

  <text x="1213" y="554" class="box-title" text-anchor="middle">KafkaEventPublisher</text>
  <text x="1213" y="582" class="box-text" text-anchor="middle">Serializa OrderSubmittedEvent</text>
  <text x="1213" y="604" class="box-text" text-anchor="middle">Key = OrderId · JSON + headers</text>
  <rect x="1144" y="622" width="138" height="23" rx="11" fill="#2563eb"/>
  <text x="1213" y="638" class="pill" text-anchor="middle" fill="#ffffff">ACKS.ALL</text>

  <text x="885" y="552" class="box-title" text-anchor="middle">orders.submitted.v1</text>
  <text x="885" y="577" class="box-text" text-anchor="middle">Tópico Kafka · chave OrderId</text>
  <rect x="773" y="598" width="224" height="28" rx="7" fill="#ffedd5" stroke="#fdba74"/>
  <text x="885" y="617" class="label" text-anchor="middle">Partição 0</text>
  <rect x="773" y="632" width="224" height="28" rx="7" fill="#ffedd5" stroke="#fdba74"/>
  <text x="885" y="651" class="label" text-anchor="middle">Partição 1</text>
  <rect x="773" y="666" width="224" height="28" rx="7" fill="#ffedd5" stroke="#fdba74"/>
  <text x="885" y="685" class="label" text-anchor="middle">Partição 2</text>

  <text x="533" y="551" class="box-title" text-anchor="middle">OrderSubmittedConsumer</text>
  <text x="533" y="579" class="box-text" text-anchor="middle">BackgroundService</text>
  <text x="533" y="602" class="box-text" text-anchor="middle">AutoCommit = false</text>
  <rect x="436" y="620" width="194" height="24" rx="12" fill="#7c3aed"/>
  <text x="533" y="636" class="pill" text-anchor="middle" fill="#ffffff">GROUP: SYSTEM-DISTRIBUTED-ORDERS</text>

  <text x="209" y="551" class="box-title" text-anchor="middle">EventHandler</text>
  <text x="209" y="579" class="box-text" text-anchor="middle">OrderSubmittedEventHandler</text>
  <text x="209" y="602" class="box-text" text-anchor="middle">Processa o evento</text>
  <text x="209" y="625" class="box-text" text-anchor="middle">em escopo de DI</text>

  <path d="M1090 590 H1037" class="flow-blue"/>
  <text x="1063" y="575" class="tiny" text-anchor="middle">publish</text>
  <path d="M733 590 H677" class="flow-blue"/>
  <text x="705" y="575" class="tiny" text-anchor="middle">consume</text>
  <path d="M389 590 H335" class="flow-blue"/>
  <text x="362" y="575" class="tiny" text-anchor="middle">handle</text>

  <!-- Commit manual: retorna do consumer ao broker após handler -->
  <path d="M209 661 V740 Q209 757 226 757 H868 Q885 757 885 740 V710" class="flow-blue"/>
  <rect x="404" y="738" width="319" height="38" rx="19" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="564" y="762" class="label" text-anchor="middle" fill="#1d4ed8">SUCESSO → commit manual do offset</text>

  <!-- Falha e retry -->
  <path d="M186 661 V804 Q186 821 203 821 H516 Q533 821 533 804 V662" class="flow-red"/>
  <rect x="230" y="794" width="260" height="52" rx="14" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="360" y="816" class="label" text-anchor="middle" fill="#b91c1c">FALHA → Seek no mesmo offset</text>
  <text x="360" y="835" class="tiny" text-anchor="middle" fill="#b91c1c">aguarda 2 s e tenta novamente</text>

  <!-- Garantia semântica -->
  <rect x="48" y="879" width="1504" height="112" rx="20" fill="#0f172a"/>
  <circle cx="101" cy="935" r="25" fill="#2563eb"/>
  <path d="M90 935 l8 8 15 -17" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="145" y="924" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="19" font-weight="700" fill="#ffffff">Semântica: at-least-once (pelo menos uma vez)</text>
  <text x="145" y="952" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#cbd5e1">O offset só é confirmado após o handler concluir. Uma queda entre o processamento e o commit pode causar reentrega.</text>
  <rect x="1228" y="910" width="275" height="50" rx="12" fill="#1e293b" stroke="#475569"/>
  <text x="1365" y="931" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="middle">CONSEQUÊNCIA</text>
  <text x="1365" y="950" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">o handler deve ser idempotente</text>
</svg>
